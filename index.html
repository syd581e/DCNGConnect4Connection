<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Connect 4 Connection Challenge</title>

<meta
  name="description"
  content="DC National Guard Connect 4 Connection Challenge"
/>

<style>
:root{
  --teal:#10b8b0;
  --purple:#7041a6;
  --dark-purple:#4e2d78;
  --ink:#101827;
  --bg:#f5f7fb;
  --white:#ffffff;
  --light-teal:#effcfb;
  --light-purple:#f4effa;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#f8fbfb,#f3eef9);
  color:var(--ink);
}

header{
  background:linear-gradient(100deg,var(--teal),var(--purple));
  color:white;
  padding:28px 18px;
  text-align:center;
}

header h1{
  font-size:clamp(30px,6vw,58px);
  margin:0;
  font-weight:900;
  letter-spacing:-2px;
}

header p{
  margin:8px 0 0;
  font-size:18px;
  font-weight:700;
}

main{
  max-width:1050px;
  margin:auto;
  padding:20px;
}

.card{
  background:var(--white);
  border-radius:22px;
  padding:22px;
  margin:16px 0;
  box-shadow:0 10px 35px #00000012;
}

h2{
  margin-top:0;
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.row>*{
  flex:1;
  min-width:200px;
}

input,
button,
select{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #d8dce6;
  font-size:16px;
}

button{
  border:0;
  background:var(--purple);
  color:white;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
  filter:brightness(1.05);
}

button.teal{
  background:var(--teal);
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
  transform:none;
}

.hidden{
  display:none!important;
}

.center{
  text-align:center;
}

.small{
  font-size:13px;
  color:#586174;
}

/* FEELING CHECK-IN */

.feeling-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  margin-top:20px;
}

.feeling{
  background:white;
  color:var(--ink);
  border:2px solid #e2e5ed;
  padding:18px;
  font-size:17px;
}

.feeling:hover{
  border-color:var(--teal);
  background:var(--light-teal);
}

.feeling.selected{
  border-color:var(--teal);
  background:var(--light-teal);
  box-shadow:0 0 0 3px #10b8b033;
}

.feeling-emoji{
  display:block;
  font-size:32px;
  margin-bottom:6px;
}

.checkin-message{
  margin-top:20px;
  padding:18px;
  background:var(--light-purple);
  border-radius:16px;
  font-weight:700;
}

/* CHALLENGE */

.challenge{
  border:3px solid var(--teal);
  background:var(--light-teal);
  border-radius:18px;
  padding:18px;
  text-align:center;
  font-size:20px;
  font-weight:800;
}

<!-- GAME -->
<div class="card hidden" id="game">

  <div class="names">
    <span id="p1">🩵 Player</span>
    <span id="p2">💜 Connection Bot</span>
  </div>

  <div
    class="turn-message"
    id="turn"
  >
    YOUR TURN
  </div>

  <div
    class="challenge"
    id="challenge"
  >
    Your presence matters. Keep going. 💜
  </div>

  <div
    class="board"
    id="board"
  ></div>

</div>

<!-- ============================= -->
<!-- GAME END -->
<!-- ============================= -->

<div
  class="card hidden"
  id="end"
>

  <h2
    class="center"
    id="result"
  ></h2>

  <p class="center">
    Keep the connection going.
    Reach out. Check in. Be there.
  </p>

  <div class="center">

    <button
      class="teal"
      onclick="playAgain()"
    >
      PLAY AGAIN
    </button>

  </div>

</div>


<!-- ============================= -->
<!-- CONNECTION COUNTER -->
<!-- ============================= -->

<div class="card">

  <h2 class="center">
    Connection Counter
  </h2>

  <div
    class="score connection-count"
    id="counter"
  >
    0
  </div>

  <p class="center">
    connections made through this challenge
  </p>

  <p class="small center">
    Every connection starts with one small step.
  </p>

</div>


</main>


<script>

const motivationalMessages = [
  "Your presence matters. Keep going. 💜",
  "One conversation can make a difference. Check in on someone today.",
  "You never know who needs to hear from you. Reach out. 🩵",
  "Connection can be a powerful form of support.",
  "A simple 'How are you?' can open an important conversation.",
  "You don't have to have all the answers. Sometimes being there is enough.",
  "Keep checking in. Keep reaching out. Keep connecting.",
  "Someone in your circle may need you more than you realize.",
  "Small acts of connection can have a lasting impact.",
  "You matter. Your teammates matter. Your connection matters."
];

const endMessages = [
  "Suicide prevention starts with connection. Check in. Listen. Be there.",
  "You don't have to be a professional to make a difference. Sometimes being present matters most.",
  "If someone is struggling, don't be afraid to ask how they're really doing.",
  "Connection saves lives. Keep reaching out and keep checking in.",
  "Your next conversation could be the one someone remembers.",
  "Be the person who checks in. Be the person who listens. Be the connection."
];

const challenges = [
  "Text someone you miss.",
  "Call someone you have not talked to in a while.",
  "Check in with your battle buddy.",
  "Ask someone: “How are you really doing?”",
  "Tell someone you appreciate them.",
  "Thank someone who has supported you.",
  "Introduce yourself to someone you do not know.",
  "Invite someone to lunch or a break.",
  "Send someone an encouraging message.",
  "Ask a teammate how you can support them.",
  "Reconnect with someone from your past.",
  "Tell someone: “You matter to me.”",
  "Take a moment to listen without trying to fix anything.",
  "Ask someone what they are looking forward to.",
  "Check on someone who may be having a hard week.",
  "Reach out to someone who has been quiet lately."
];

let me = null;
let game = null;
let selectedFeeling = null;
let connectionCount =
  Number(localStorage.getItem("connect4Connections")) || 0;

let botTeam = null;
let difficulty = "medium";


/* =========================
   FEELING CHECK-IN
========================= */

function selectFeeling(button, feeling) {

  document
    .querySelectorAll(".feeling")
    .forEach(item => {
      item.classList.remove("selected");
    });

  button.classList.add("selected");

  selectedFeeling = feeling;

  const messages = {

    good:
      "That's great. Keep that positive energy going and share it with someone else.",

    okay:
      "That's okay. Sometimes checking in is all it takes to start a conversation.",

    rough:
      "Thank you for being honest. You don't have to carry everything by yourself. Connection matters.",

    stressed:
      "Take a breath. You don't have to figure everything out alone.",

    talk:
      "You're not alone. Consider reaching out to someone you trust."
  };

  const message =
    document.getElementById("checkinMessage");

  message.textContent =
    messages[feeling];

  message.classList.remove("hidden");

  document.getElementById(
    "continueButton"
  ).disabled = false;
}


/* =========================
   CONTINUE
========================= */

function continueToGame() {

  if (!selectedFeeling) return;

  document
    .getElementById("checkin")
    .classList.add("hidden");

  document
    .getElementById("setup")
    .classList.remove("hidden");
}


/* =========================
   START GAME
========================= */

function startComputerGame() {

  const name =
    document.getElementById("name")
      .value.trim() || "Player";

  me = {
    name: name,
    team:
      document.getElementById("team").value
  };

  difficulty =
    document.getElementById("difficulty").value;

  botTeam =
    me.team === "teal"
      ? "purple"
      : "teal";

  game = {

    grid:
      Array.from(
        { length: 6 },
        () => Array(7).fill(null)
      ),

    turn: me.team,

    winner: null,

    draw: false
  };

  document
    .getElementById("setup")
    .classList.add("hidden");

  document
    .getElementById("game")
    .classList.remove("hidden");

  document
    .getElementById("end")
    .classList.add("hidden");

  document
    .getElementById("p1")
    .textContent =
      (me.team === "teal" ? "🩵 " : "💜 ")
      + name;

  document
    .getElementById("p2")
    .textContent =
      (botTeam === "teal" ? "🩵 " : "💜 ")
      + "Connection Bot";

  showMotivationalMessage();

  render();
}


/* =========================
   RENDER BOARD
========================= */

function render() {

  if (!game) return;

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  game.grid.forEach(
    (row, rowIndex) => {

      row.forEach(
        (value, colIndex) => {

          const cell =
            document.createElement("div");

          cell.className =
            "cell " + (value || "");

          cell.onclick =
            () => playerMove(colIndex);

          board.appendChild(cell);

        }
      );

    }
  );


  const turn =
    document.getElementById("turn");

  if (game.winner) {

    turn.textContent =
      game.winner === me.team
        ? "🎉 YOU WON!"
        : "🤖 BOT WON!";

  } else if (game.draw) {

    turn.textContent =
      "🤝 IT'S A DRAW!";

  } else if (game.turn === me.team) {

    turn.textContent =
      "YOUR TURN";

  } else {

    turn.textContent =
      "BOT'S TURN";

  }
}


/* =========================
   PLAYER MOVE
========================= */

function playerMove(column) {

  if (!game) return;

  if (game.winner || game.draw) return;

  if (game.turn !== me.team) return;

  const moved =
    dropPiece(
      column,
      me.team
    );

  if (!moved) return;

  render();

  if (game.winner) {

    setTimeout(
      finishGame,
      500
    );

    return;
  }

  if (isBoardFull()) {

    game.draw = true;

    setTimeout(
      finishGame,
      500
    );

    return;
  }

  game.turn = botTeam;

  render();

  setTimeout(
    botMove,
    700
  );
}


/* =========================
   DROP PIECE
========================= */

function dropPiece(column, player) {

  let row = -1;

  for (
    let r = 5;
    r >= 0;
    r--
  ) {

    if (
      game.grid[r][column] === null
    ) {

      row = r;
      break;

    }
  }

  if (row === -1) {

    return false;

  }

  game.grid[row][column] =
    player;

  if (
    checkWin(
      game.grid,
      row,
      column,
      player
    )
  ) {

    game.winner =
      player;

  }

  return true;
}


/* =========================
   BOT MOVE
========================= */

function botMove() {

  if (
    !game ||
    game.winner ||
    game.draw
  ) return;

  const column =
    chooseBotColumn();

  dropPiece(
    column,
    botTeam
  );

  render();

  if (game.winner) {

    setTimeout(
      finishGame,
      600
    );

    return;
  }

  if (isBoardFull()) {

    game.draw = true;

    setTimeout(
      finishGame,
      600
    );

    return;
  }

  game.turn = me.team;

  showMotivationalMessage();

  render();
}


/* =========================
   MOTIVATIONAL MESSAGE
========================= */

function showMotivationalMessage() {

  const challenge =
    document.getElementById("challenge");

  const message =
    motivationalMessages[
      Math.floor(
        Math.random() *
        motivationalMessages.length
      )
    ];

  challenge.textContent =
    message;
}


/* =========================
   BOT AI
========================= */

function chooseBotColumn() {

  const columns =
    availableColumns();

  if (!columns.length) {
    return 0;
  }


  const winningMove =
    findWinningMove(botTeam);

  if (winningMove !== null) {
    return winningMove;
  }


  if (difficulty !== "easy") {

    const blockingMove =
      findWinningMove(me.team);

    if (blockingMove !== null) {
      return blockingMove;
    }
  }


  if (difficulty === "hard") {

    const preferred =
      [3,2,4,1,5,0,6];

    for (
      const column of preferred
    ) {

      if (
        columns.includes(column)
      ) {

        return column;

      }
    }
  }


  return columns[
    Math.floor(
      Math.random() *
      columns.length
    )
  ];
}


/* =========================
   AVAILABLE COLUMNS
========================= */

function availableColumns() {

  return Array
    .from(
      { length: 7 },
      (_, column) => column
    )
    .filter(
      column =>
        game.grid[0][column] === null
    );
}


/* =========================
   FIND WINNING MOVE
========================= */

function findWinningMove(player) {

  const columns =
    availableColumns();

  for (
    const column of columns
  ) {

    const testGrid =
      game.grid.map(
        row => row.slice()
      );

    let row = -1;

    for (
      let r = 5;
      r >= 0;
      r--
    ) {

      if (
        testGrid[r][column] === null
      ) {

        row = r;
        break;

      }
    }

    if (row === -1) continue;

    testGrid[row][column] =
      player;

    if (
      checkWin(
        testGrid,
        row,
        column,
        player
      )
    ) {

      return column;

    }
  }

  return null;
}


/* =========================
   CHECK WIN
========================= */

function checkWin(
  grid,
  row,
  column,
  player
) {

  const directions = [

    [1,0],
    [0,1],
    [1,1],
    [1,-1]

  ];

  for (
    const [dr, dc]
    of directions
  ) {

    let count = 1;

    for (
      const direction
      of [-1,1]
    ) {

      let r =
        row +
        direction * dr;

      let c =
        column +
        direction * dc;

      while (
        r >= 0 &&
        r < 6 &&
        c >= 0 &&
        c < 7 &&
        grid[r][c] === player
      ) {

        count++;

        r +=
          direction * dr;

        c +=
          direction * dc;
      }
    }

    if (count >= 4) {
      return true;
    }
  }

  return false;
}


/* =========================
   BOARD FULL
========================= */

function isBoardFull() {

  return game.grid[0]
    .every(
      cell =>
        cell !== null
    );
}


/* =========================
   END GAME
========================= */

function finishGame() {

  render();

  const end =
    document.getElementById("end");

  const result =
    document.getElementById("result");


  if (game.winner) {

    if (
      game.winner === me.team
    ) {

      result.textContent =
        "🎉 YOU CONNECTED 4!";

    } else {

      result.textContent =
        "🤖 THE CONNECTION BOT CONNECTED 4!";

    }

  } else {

    result.textContent =
      "🤝 GREAT GAME — IT'S A DRAW!";

  }


  end.classList.remove("hidden");

  end.scrollIntoView({
    behavior: "smooth"
  });


  showEndChallenge();
}


/* =========================
   FINAL CHALLENGE
========================= */

function showEndChallenge() {

  const challenge =
    document.getElementById("challenge");

  const finalMessage =
    endMessages[
      Math.floor(
        Math.random() *
        endMessages.length
      )
    ];

  challenge.innerHTML =
    "<strong>" +
    finalMessage +
    "</strong>" +
    "<br><br>" +
    "Your Connection Challenge:" +
    "<br><br>" +
    "<span style='color:#7041a6'>" +
    pickChallenge() +
    "</span>";
}


/* =========================
   RANDOM CHALLENGE
========================= */

function pickChallenge() {

  return challenges[
    Math.floor(
      Math.random() *
      challenges.length
    )
  ];
}


/* =========================
   PLAY AGAIN
========================= */

function playAgain() {

  game = null;

  selectedFeeling = null;

  document
    .getElementById("end")
    .classList.add("hidden");

  document
    .getElementById("game")
    .classList.add("hidden");

  document
    .getElementById("setup")
    .classList.add("hidden");

  document
    .getElementById("checkin")
    .classList.remove("hidden");

  document
    .querySelectorAll(".feeling")
    .forEach(
      button =>
        button.classList.remove("selected")
    );

  document
    .getElementById("checkinMessage")
    .classList.add("hidden");

  document
    .getElementById("continueButton")
    .disabled = true;
}


/* =========================
   CONNECTION COUNTER
========================= */

function updateCounter() {

  document
    .getElementById("counter")
    .textContent =
      connectionCount;

}

updateCounter();

</script>
